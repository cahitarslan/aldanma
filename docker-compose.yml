# Local or single-server setup: PostgreSQL + API. The static site (dist/) is served separately
# (Cloudflare Workers, or any static host). Copy .env.example to .env and fill in the secrets first.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aldanma
      POSTGRES_USER: aldanma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aldanma"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Database: Host=db;Database=aldanma;Username=aldanma;Password=${POSTGRES_PASSWORD};Maximum Pool Size=${DB_MAX_POOL_SIZE:-20};Command Timeout=${DB_COMMAND_TIMEOUT:-10};Timeout=5
      Aldanma__HashKey: ${ALDANMA_HASH_KEY:?set ALDANMA_HASH_KEY in .env}
      Aldanma__AdminKey: ${ALDANMA_ADMIN_KEY:-}
      Aldanma__TurnstileSecret: ${ALDANMA_TURNSTILE_SECRET:-}
      Aldanma__AllowedOrigins__0: ${ALDANMA_SITE_ORIGIN:-https://aldanma.cahitarslan.com}
      # The API is published on 127.0.0.1 only, so the reverse proxy is the only way in and its header can be trusted.
      Aldanma__ClientIpHeader: ${ALDANMA_CLIENT_IP_HEADER:-X-Forwarded-For}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  db-data:
